name: Build & Publish Container Images

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/build-and-push.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push OCI Images to GHCR
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (extended build capabilities)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Ensure repository owner is strictly lowercase (required for OCI images)
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ----------------------------------------------------
      # Step 5: Build & Push SMS Service (Node.js/Express)
      # ----------------------------------------------------
      - name: Build & Push SMS Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sms-service
          file: ./backend/sms-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/disaster-sms-service:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/disaster-sms-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # Step 6: Build & Push Mapping Service (Python/FastAPI)
      # ----------------------------------------------------
      - name: Build & Push Mapping Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/mapping-service
          file: ./backend/mapping-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/disaster-mapping-service:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/disaster-mapping-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
